---
catalyst_center_hosts:
  hosts:
    catalyst_center53:
      catalyst_center_password: "{{ lookup('env', 'CATALYST_CENTER_PASSWORD') }}"
      catalyst_center_host: "{{ lookup('env', 'CATALYST_CENTER_HOST') }}"
      catalyst_center_port: 443
      catalyst_center_timeout: 300
      catalyst_center_username: "{{ lookup('env', 'CATALYST_CENTER_USER') }}"
      catalyst_center_version: 2.3.7.9
      catalyst_center_verify: false
      catalyst_center_debug: true
      catalyst_center_log_level: DEBUG
      catalyst_center_log: true
      catalyst_center_log_append: false
      catalyst_center_log_file_path: "dnac_log.log"
      catalyst_center_api_task_timeout: 1200
