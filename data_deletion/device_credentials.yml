catalyst_center_version: 2.3.7.6
device_credentials:
  credentials_details:
  - global_credential_details:
      cli_credential:
      - description: CLI Sample 1
        username: cli-1
        password: "{{ lookup('env', 'NAC_DATA_DELETION_DEVICE_CREDENTIALS_YML_PASSWORD_1') }}"
        enable_password: "{{ lookup('env', 'NAC_DATA_DELETION_DEVICE_CREDENTIALS_YML_ENABLE_PASSWORD_1') }}"
      - description: CLI2
        username: cli-2
        password: "{{ lookup('env', 'NAC_DATA_DELETION_DEVICE_CREDENTIALS_YML_PASSWORD_2') }}"
        enable_password: "{{ lookup('env', 'NAC_DATA_DELETION_DEVICE_CREDENTIALS_YML_ENABLE_PASSWORD_2') }}"
      - description: switchandwlc credentials
        username: wlcaccess
        password: "{{ lookup('env', 'NAC_DATA_DELETION_DEVICE_CREDENTIALS_YML_PASSWORD_3') }}"#123
        enable_password: "{{ lookup('env', 'NAC_DATA_DELETION_DEVICE_CREDENTIALS_YML_ENABLE_PASSWORD_3') }}"#123
      snmp_v3:
      - description: snmpV3 Sample 1
        auth_password: "{{ lookup('env', 'NAC_DATA_DELETION_DEVICE_CREDENTIALS_YML_AUTH_PASSWORD_1') }}"#@2xi5
        auth_type: SHA
        snmp_mode: AUTHPRIV
        privacy_password: "{{ lookup('env', 'NAC_DATA_DELETION_DEVICE_CREDENTIALS_YML_PRIVACY_PASSWORD_1') }}"
        privacy_type: AES128
        username: admin
      https_read:
      - description: httpsRead Sample 1
        username: admin
        password: "{{ lookup('env', 'NAC_DATA_DELETION_DEVICE_CREDENTIALS_YML_PASSWORD_4') }}"
        port: 443
      https_write:
      - description: httpsWrite Sample 1
        username: admin
        password: "{{ lookup('env', 'NAC_DATA_DELETION_DEVICE_CREDENTIALS_YML_PASSWORD_5') }}"
        port: 443
